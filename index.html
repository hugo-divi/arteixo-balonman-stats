<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141f52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AB Stats">
<title>Arteixo Balonmán · Estadísticas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffd400' stroke='%231b2a6b' stroke-width='3'/%3E%3Ctext x='32' y='38' font-size='20' font-family='Arial' font-weight='900' fill='%231b2a6b' text-anchor='middle'%3EAB%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231b2a6b'/%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ffd400'/%3E%3Ctext x='32' y='39' font-size='20' font-family='Arial' font-weight='900' fill='%231b2a6b' text-anchor='middle'%3EAB%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/json,{"name":"Arteixo Balonmán Estadísticas","short_name":"AB Stats","start_url":".","display":"standalone","background_color":"%23f4f5f8","theme_color":"%23141f52"}'>
<style>
  :root{
    --navy:#1b2a6b; --navy-d:#0f1744; --navy-l:#2c3f9c;
    --gold:#ffd400; --gold-l:#ffe670; --gold-d:#e0ad00;
    --bg:#f2f3f8; --card:#ffffff; --ink:#171b2e; --muted:#5b6178; --line:#e6e8f0;
    --ok:#1f9d55; --bad:#d64545; --warn:#c97a00;
    --shadow:0 2px 6px rgba(20,25,60,.07),0 10px 26px rgba(20,25,60,.07);
    --shadow-lg:0 14px 34px rgba(15,23,68,.20);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none;
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select{font-family:inherit;font-size:15px}
  .row{display:flex;gap:8px;align-items:center}
  .grow{flex:1}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .hide{display:none!important}
  .ic{display:inline-block;vertical-align:-3px;flex:none}

  /* ---------- Top bar ---------- */
  header.bar{
    position:sticky;top:0;z-index:30;color:#fff;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-d) 100%);
    padding:calc(env(safe-area-inset-top,0px) + 11px) 16px 11px;
    display:flex;align-items:center;gap:10px;box-shadow:0 3px 14px rgba(0,0,0,.22)
  }
  header.bar h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header.bar .hbtn{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:700;color:#fff}
  header.bar .hbtn:active{background:rgba(255,255,255,.28)}

  .crest{border-radius:50%;flex:none;background-size:cover;background-position:center;overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.2)}
  .crest svg{display:block;width:100%;height:100%}

  main{flex:1;padding:14px 16px calc(90px + var(--safe-b))}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  h2.sec{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:20px 0 9px;
    font-weight:800;position:relative;padding-left:11px}
  h2.sec::before{content:"";position:absolute;left:0;top:1px;bottom:1px;width:3px;border-radius:2px;background:var(--gold-d)}
  h2.sec:first-child{margin-top:2px}
  h2.sec .soft{text-transform:none;font-weight:600;color:var(--muted);letter-spacing:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .pad{padding:16px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(180deg,var(--navy-l),var(--navy));color:#fff;border-radius:13px;padding:14px 16px;
    font-weight:700;font-size:15px;width:100%;box-shadow:0 6px 16px rgba(20,30,90,.25);transition:transform .1s,box-shadow .1s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn:active{transform:translateY(1px);box-shadow:0 2px 8px rgba(20,30,90,.22)}
  .btn.gold{background:linear-gradient(180deg,var(--gold-l),var(--gold) 60%,var(--gold-d));color:var(--navy);
    box-shadow:0 6px 16px rgba(224,173,0,.35),inset 0 1px 0 rgba(255,255,255,.5)}
  .btn.gold:active{box-shadow:0 2px 8px rgba(224,173,0,.3)}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy);box-shadow:none}
  .btn.soft{background:#eef0f8;color:var(--navy);box-shadow:none}
  .btn.danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad);box-shadow:none}
  .btn.sm{padding:9px 12px;font-size:13px;border-radius:11px;width:auto}
  .btn[disabled]{opacity:.4;pointer-events:none}

  .navrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .navcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:15px;padding:13px 6px 11px;box-shadow:var(--shadow);font-weight:700;font-size:12px;color:var(--navy)}
  .navcard .ic{width:20px;height:20px;color:var(--navy-l)}
  .navcard:active{background:#f6f7fb;transform:translateY(1px)}

  .field{margin:10px 0}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 2px 5px;text-transform:uppercase;letter-spacing:.4px}
  .field input[type=text],.field input[type=date],.field select{
    width:100%;padding:12px;border:1.5px solid var(--line);border-radius:11px;background:#fbfbfd}
  .seg{display:flex;background:#eef0f8;border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;padding:10px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .1s}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
  .seg button:active{opacity:.65}

  /* ---------- Avatars ---------- */
  .av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
    color:#fff;font-weight:800;font-size:15px;background-size:cover;background-position:center;position:relative;
    border:2px solid #fff;box-shadow:0 0 0 1px var(--line),0 3px 8px rgba(20,25,60,.12)}
  .av.gk::after{content:"🧤";position:absolute;right:-3px;bottom:-3px;font-size:13px;background:#fff;border-radius:50%;
    width:18px;height:18px;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
  .av.juv{box-shadow:0 0 0 2px var(--gold),0 3px 8px rgba(20,25,60,.12)}
  .av.big{width:66px;height:66px;font-size:20px}

  /* ---------- Match list ---------- */
  .mrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);transition:background .1s}
  .mrow:last-child{border-bottom:0}
  .mrow:active{background:#f4f5fa}
  .mrow .res{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;width:58px;flex:none;text-align:right}
  .mrow .vs{flex:1;min-width:0}
  .mrow .vs b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .vs span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:999px;text-transform:uppercase}
  .tag.live{background:#ffe9e9;color:var(--bad)}
  .tag.win{background:#e5f6ec;color:var(--ok)}
  .tag.lose{background:#fdeaea;color:var(--bad)}
  .tag.draw{background:#eef0f8;color:var(--muted)}

  /* ---------- Convocatoria ---------- */
  .plist{display:flex;flex-direction:column}
  .pitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);transition:background .1s}
  .pitem:last-child{border-bottom:0}
  .pitem:active{background:#f4f5fa}
  .pitem .nm{flex:1;min-width:0}
  .pitem .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pitem .nm span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:900;color:#fff}
  .chk.on{background:var(--navy);border-color:var(--navy)}
  .role{font-size:11px;font-weight:800;color:var(--navy);background:var(--gold);border-radius:6px;padding:2px 6px}
  .role.field{background:#eef0f8;color:var(--muted)}

  /* ---------- Scoreboard ---------- */
  .score{position:relative;overflow:hidden;color:#fff;border-radius:18px;padding:15px 16px 13px;
    background:linear-gradient(160deg,var(--navy-l) 0%,var(--navy) 55%,var(--navy-d) 100%);
    box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,.08)}
  .score::before{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,212,0,.16),transparent 70%)}
  .score .teams{display:flex;align-items:center;gap:8px;font-weight:800;position:relative}
  .score .teams .n{flex:1;display:flex;align-items:center;gap:6px;font-size:13.5px}
  .score .teams .n.r{justify-content:flex-end;text-align:right}
  .score .big{font-size:42px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0;position:relative}
  .score .big .sep{opacity:.5;margin:0 10px}
  .score .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#cdd3f0;position:relative}
  .streak{background:var(--gold);color:var(--navy);font-weight:900;border-radius:999px;padding:3px 10px;font-size:12px}
  .streak.riv{background:#ff6b6b;color:#fff}

  /* ---------- Portería ---------- */
  .gkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding:0 2px}
  .gkwho{display:flex;align-items:center;gap:8px;font-size:13px}
  .gkwho .av{width:26px;height:26px;font-size:10px}
  .gkswitch{display:inline-flex;align-items:center;gap:5px;background:#eef0f8;color:var(--navy);font-weight:800;
    font-size:12px;border-radius:999px;padding:7px 13px}
  .gkswitch:active{background:#e1e5f3}
  .gkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .gkbtn{border:1.5px solid transparent;border-radius:14px;padding:14px 8px;font-weight:800;font-size:14px;
    display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);transition:transform .1s,filter .1s}
  .gkbtn.save{background:linear-gradient(180deg,#eafbf1,#dcf6e7);color:#177a42;border-color:#bfead2}
  .gkbtn.conc{background:linear-gradient(180deg,#fff0f0,#ffe1e1);color:#b83a3a;border-color:#f3c6c6}
  .gkbtn.riv{grid-column:1/-1;background:linear-gradient(180deg,#fff0f0,#ffe1e1);color:#b83a3a;border-color:#f3c6c6}
  .gkbtn:active{transform:translateY(1px);filter:brightness(.96)}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:4px;background:#eef0f8;border-radius:13px;padding:4px;margin:14px 0}
  .tabs button{flex:1;padding:9px 2px;border-radius:10px;font-weight:700;font-size:12px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .1s}
  .tabs button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
  .tabs button:active{opacity:.65}
  .tabs .ic{width:15px;height:15px}

  /* ---------- Rejilla de jugadores ---------- */
  .court{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px 6px 9px;display:flex;flex-direction:column;
    align-items:center;gap:5px;box-shadow:var(--shadow);position:relative}
  .pcard:active{transform:translateY(1px);background:#f7f8fc}
  .pcard.sel{outline:2px solid var(--gold)}
  .pcard .nick{font-weight:800;font-size:13px;text-align:center;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .pcard .full{font-size:10px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .pcard .mini{font-size:9.5px;color:var(--navy);font-weight:800;background:var(--gold);border-radius:6px;padding:1px 6px}
  .tstar{position:absolute;top:6px;right:8px;color:var(--gold-d);font-size:12px;text-shadow:0 1px 1px rgba(0,0,0,.1)}

  /* ---------- Bottom sheet ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,14,40,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:14px 14px calc(20px + var(--safe-b));
    max-height:86vh;overflow:auto;animation:up .18s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet .shhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .sheet .shhead .nick{font-weight:900;font-size:18px}
  .sheet .shhead .x{margin-left:auto;background:#e9ebf3;border-radius:10px;padding:8px 12px;font-weight:800}
  .agroup{margin-top:14px}
  .agroup h4{margin:0 2px 7px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800}
  .agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .abtn{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 10px;font-weight:800;font-size:15px;color:var(--ink);
    text-align:center;box-shadow:var(--shadow);transition:transform .1s,filter .1s}
  .abtn:active{transform:translateY(1px);filter:brightness(.97)}
  .abtn.hero{grid-column:1/-1;background:linear-gradient(180deg,var(--gold-l),var(--gold) 60%,var(--gold-d));color:var(--navy);font-size:20px;padding:20px;
    box-shadow:0 6px 16px rgba(224,173,0,.35)}
  .abtn.pos{background:linear-gradient(180deg,#eafbf1,#dcf6e7);color:#177a42;border-color:#bfead2}
  .abtn.neg{background:linear-gradient(180deg,#fff0f0,#ffe1e1);color:#b83a3a;border-color:#f3c6c6}
  .abtn.warn{background:linear-gradient(180deg,#fff7e6,#ffedc2);color:#8a5900;border-color:#f0dba3}

  /* ---------- Toast ---------- */
  #toast{position:fixed;left:0;right:0;bottom:calc(14px + var(--safe-b));display:flex;justify-content:center;z-index:80;pointer-events:none}
  #toast .in{background:var(--ink);color:#fff;border-radius:999px;padding:10px 8px 10px 16px;display:flex;align-items:center;gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92%;pointer-events:auto;transform:translateY(80px);opacity:0;transition:.22s}
  #toast.show .in{transform:translateY(0);opacity:1}
  #toast .in b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toast .in button{background:var(--gold);color:var(--navy);font-weight:900;border-radius:999px;padding:7px 13px;font-size:12px;flex:none}
  #toast .dot{width:9px;height:9px;border-radius:50%;flex:none;background:#7d84a3}
  #toast .dot.pos{background:var(--ok)}
  #toast .dot.neg{background:var(--bad)}
  #toast .dot.warn{background:var(--warn)}

  /* ---------- Modal de confirmación (propio, sin confirm()/alert() nativos) ---------- */
  .cmodal{padding:8px 6px 4px;text-align:center}
  .cmodal .cicon{width:52px;height:52px;border-radius:50%;background:#fdeaea;color:var(--bad);display:flex;align-items:center;justify-content:center;margin:2px auto 12px}
  .cmodal h3{margin:0 0 8px;font-size:18px;font-weight:900;color:var(--ink)}
  .cmodal p{margin:0 0 20px;font-size:14px;color:var(--muted);line-height:1.55}
  .cmodal .crow{display:flex;gap:10px}
  .cmodal .crow .btn{flex:1}
  .btn.danger2{background:linear-gradient(180deg,#ff8f8f,var(--bad));color:#fff;box-shadow:0 6px 16px rgba(214,69,69,.35)}
  .btn.danger2:active{box-shadow:0 2px 8px rgba(214,69,69,.3)}

  /* ---------- Tables ---------- */
  .twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:13px;border:1px solid var(--line);background:#fff}
  table.st{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
  table.st th,table.st td{padding:8px 9px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
  table.st th{background:#f0f2f8;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
  table.st td.name,table.st th.name{text-align:left;position:sticky;left:0;background:#fff;font-weight:700;box-shadow:1px 0 0 var(--line)}
  table.st th.name{background:#f0f2f8}
  table.st tr:last-child td{border-bottom:0}
  table.st .val{font-weight:900}
  .pos{color:var(--ok)} .neg{color:var(--bad)}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;box-shadow:var(--shadow)}
  .kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .kpi .v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11px;color:var(--muted)}

  .mvp{background:linear-gradient(135deg,var(--gold-l),var(--gold));border-radius:16px;padding:15px;color:var(--navy);
    box-shadow:0 10px 24px rgba(224,173,0,.3),inset 0 1px 0 rgba(255,255,255,.5)}
  .mvp .lbl{font-size:11px;font-weight:900;letter-spacing:1px}
  .mvp .who{font-size:20px;font-weight:900;margin:2px 0}
  .hl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
  .hl:last-child{border-bottom:0}
  .hl .em{font-size:18px}
  .hl b{margin-left:auto}

  /* ---------- Timeline ---------- */
  .tl{display:flex;flex-direction:column;gap:8px}
  .run{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;box-shadow:var(--shadow)}
  .run .bars{display:flex;gap:3px;flex-wrap:wrap;max-width:150px}
  .run .b{width:11px;height:20px;border-radius:3px}
  .run .b.n{background:var(--navy)} .run .b.r{background:var(--bad)}
  .run .txt{flex:1;font-size:12.5px}
  .run .sc{font-weight:900;font-variant-numeric:tabular-nums}
  .run.big{outline:2px solid var(--gold)}

  /* ---------- Registro ---------- */
  .log{display:flex;flex-direction:column}
  .lg{display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
  .lg:last-child{border-bottom:0}
  .lg .t{font-size:11px;color:var(--muted);width:44px;flex:none;font-variant-numeric:tabular-nums}
  .lg .d{flex:1;min-width:0}
  .lg .d b{font-weight:700}
  .lg .del{color:var(--bad);font-weight:900;background:#fdeaea;border-radius:8px;padding:5px 9px;font-size:12px}
  .lg.rivgoal{background:#fff6f6}

  .fab{position:sticky;bottom:calc(12px + var(--safe-b));margin-top:14px;display:flex;gap:8px;z-index:20}
  .fab > .btn{flex:1;width:auto;min-width:0}

  .note{font-size:12px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:11px;padding:10px 12px}
  a.link{color:var(--navy);font-weight:700}
  #printArea{display:none}
  @media print{
    body{background:#fff}
    #app{display:none!important}
    #printArea{display:block!important;max-width:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"><div class="in"><span class="dot" id="toastDot"></span><b id="toastText"></b><button id="toastUndo">DESHACER</button></div></div>
<div id="printArea"></div>
<input type="file" id="filePick" accept="image/*" class="hide">
<input type="file" id="jsonPick" accept="application/json,.json" class="hide">

<script>
"use strict";
/* ============================================================

function actionCls(k){
  if(k==="gol") return "hero";
  if(["contra","gol7m","golPortero","recuperacion","blocaje","parada","parada7m","asistencia","prov7m"].includes(k)) return "pos";
  if(["tiroFuera","tiroParado","perdida","fallo7m","comete7m","golEncajado","golEnc7m","roja"].includes(k)) return "neg";
  if(["dosmin","amarilla"].includes(k)) return "warn";
  return "";
}
function actionTone(tipo){
  if(tipo==="golRival") return "neg";
  const w = S.weights[tipo]||0;
  if(w>0) return "pos";
  if(w<0) return "neg";
  return "";
}
function defaultWeights(){ const w={}; for(const k in ACC) w[k]=ACC[k].pts; return w; }

    team: {name:"Arteixo Balonmán", crest:null},

  };

function load(){

    const r = JSON.parse(localStorage.getItem(KEY));
    if(r && r.roster && r.matches){
      r.weights = Object.assign(defaultWeights(), r.weights||{});
      r.team = Object.assign({name:"Arteixo Balonmán",crest:null}, r.team||{});
      return r;
    }
  }catch(e){}
  return fresh();
}

/* ---------- utilidades ---------- */
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function vibrate(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
function hashCode(id){ let h=0; for(const c of id) h=(h*31 + c.charCodeAt(0))>>>0; return h; }
function hueOf(id){
  // reparte los tonos en partes iguales de 360° según el tamaño de la plantilla:
  // con N jugadores, la separación mínima garantizada entre dos cualesquiera es 360/N,
  // así nunca hay dos colores parecidos por casualidad (a diferencia de un hash aleatorio)
  const idx = S.roster.findIndex(p => p.id===id);
  const n = Math.max(S.roster.length, 1);
  const base = idx>=0 ? idx : (hashCode(id) % n);
  return Math.round(base * (360/n)) % 360;
}
function initials(nick){
  const parts = nick.trim().split(/\s+/);
  if(parts.length>=2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return nick.slice(0,2).toUpperCase();
}
function avatar(p, cls=""){
  const h = hueOf(p.id);
  // hsl como respaldo; oklch (perceptualmente uniforme) encima para que todos los
  // tonos —incluidos rojos y amarillos— se vean igual de distintos entre sí
  const style = p.foto
    ? `background-image:url('${p.foto}')`
    : `background-color:hsl(${h} 42% 40%);background-color:oklch(53% 0.11 ${h})`;
  const c = `av ${cls} ${p.puesto==="portero"?"gk":""} ${p.cat==="juvenil"?"juv":""}`;
  return `<span class="${c}" style="${style}">${p.foto?"":esc(initials(p.apodo))}</span>`;
}
function crestHTML(size){
  const s = size||36;
  const style = `width:${s}px;height:${s}px`;
  return S.team.crest
    ? `<span class="crest" style="${style};background-image:url('${S.team.crest}')"></span>`
    : `<span class="crest" style="${style}">${crestSVG(s)}</span>`;
}
function fmtDate(d){
  if(!d) return "";
  const x = new Date(d+"T00:00:00");
  if(isNaN(x)) return d;
  return x.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function relTime(ms, t0){
  const s = Math.max(0, Math.round((ms-t0)/1000));
  const m = Math.floor(s/60);
  return m+"′";
}
function pct(n,d){ return d>0 ? Math.round(100*n/d) : 0; }

/* ============================================================
   CÁLCULO DE ESTADÍSTICAS
   ============================================================ */
function count(ev, tipo){ return ev.filter(e => e.tipo===tipo).length; }

function playerStats(match, pid){
  const p = player(pid);
  const ev = match.events.filter(e => e.jugador===pid);
  const c = t => count(ev, t);
  const goles   = c("gol") + c("contra") + c("golPortero");
  const tp = c("tiroParado"), tf = c("tiroFuera");
  const tiros   = goles + tp + tf;
  const g7 = c("gol7m"), f7 = c("fallo7m");
  const paradas = c("parada"), enc = c("golEncajado");
  const par7 = c("parada7m"), enc7 = c("golEnc7m");
  const val = ev.reduce((a,e)=> a + (S.weights[e.tipo]||0), 0);
  return {
    p, ev, val,
    goles, contra:c("contra"), tp, tf, tiros, pctTiro: pct(goles, tiros),
    g7, f7, l7: g7+f7, pct7: pct(g7, g7+f7), prov7:c("prov7m"),
    perdidas:c("perdida"), recup:c("recuperacion"), blocaje:c("blocaje"),
    comete7:c("comete7m"), dosmin:c("dosmin"), amarilla:c("amarilla"), roja:c("roja"),
    paradas, enc, pctPar: pct(paradas, paradas+enc),
    par7, enc7, pctPar7: pct(par7, par7+enc7),
    asist:c("asistencia"), golGk:c("golPortero"),
  };
}

function teamStats(match){
  const conv = match.convocados;
  const campo = conv.filter(id => player(id).puesto==="campo");
  const gk = conv.filter(id => player(id).puesto==="portero");
  const sum = (ids,key) => ids.reduce((a,id)=> a + playerStats(match,id)[key], 0);
  const golesJuego = sum(campo,"goles");
  const tiros = sum(campo,"tiros");
  const g7 = sum(campo.concat(gk),"g7"), l7 = sum(campo.concat(gk),"l7");
  const paradas = sum(gk,"paradas"), enc = sum(gk,"enc");
  const par7 = sum(gk,"par7"), enc7 = sum(gk,"enc7");
  return {
    campo, gk,
    tiro:{n:golesJuego, d:tiros, pct:pct(golesJuego,tiros)},
    siete:{n:g7, d:l7, pct:pct(g7,l7)},
    paradas:{n:paradas, d:paradas+enc, pct:pct(paradas,paradas+enc)},
    paradas7:{n:par7, d:par7+enc7, pct:pct(par7,par7+enc7)},
  };
}

function score(match, period){
  const f = e => (!period || e.periodo===period);
  return {
    nos: match.events.filter(e => OURS.includes(e.tipo) && f(e)).length,
    riv: match.events.filter(e => THEIRS.includes(e.tipo) && f(e)).length,
  };
}
function streak(match){
  const gs = match.events.filter(e => OURS.includes(e.tipo) || THEIRS.includes(e.tipo));
  let n=0, team=null;
  for(let i=gs.length-1;i>=0;i--){
    const t = OURS.includes(gs[i].tipo) ? "nos" : "riv";
    if(team===null) team=t;
    if(t===team) n++; else break;
  }
  return {team, n};
}
function runs(match){
  const gs = match.events.filter(e => OURS.includes(e.tipo) || THEIRS.includes(e.tipo))
                         .map(e => ({team: OURS.includes(e.tipo)?"n":"r", t:e.t, per:e.periodo}));
  const out=[]; let cur=null; let sN=0,sR=0;
  for(const g of gs){
    if(g.team==="n") sN++; else sR++;
    if(!cur || cur.team!==g.team){ cur={team:g.team, count:1, t0:g.t, t1:g.t, per:g.per, sN, sR}; out.push(cur); }
    else { cur.count++; cur.t1=g.t; cur.sN=sN; cur.sR=sR; }
  }
  return out;
}
function mvpTable(match){
  return match.convocados.map(id => ({id, p:player(id), st:playerStats(match, id)}))
    .sort((a,b)=> b.st.val - a.st.val);
}
function highlights(match){
  const rows = mvpTable(match);
  const campo = rows.filter(r => r.p.puesto==="campo");
  const gks   = rows.filter(r => r.p.puesto==="portero");
  const best = (arr, f) => arr.slice().sort((a,b)=> f(b)-f(a))[0];
  const mvp = rows[0] && rows[0].st.val>0 ? rows[0] : null;
  const goleador = best(campo, r => r.st.goles + r.st.g7);
  const defensor = best(campo, r => r.st.recup + r.st.blocaje);
  const asis = best(rows, r => r.st.asist);
  const portero = gks.filter(r => (r.st.paradas + r.st.enc) >= 5)
                     .sort((a,b)=> b.st.pctPar - a.st.pctPar)[0]
                  || best(gks, r => r.st.paradas);
  return {mvp, goleador, defensor, asis, portero};
}
function labelPDF(p){
  const apo = p.apodo && p.apodo.toLowerCase()!==p.corto.toLowerCase() ? ` (${p.apodo})` : "";
  return p.corto + apo;
}
function played(m, id){
  const started = (m.titulares.campo||[]).includes(id) || m.titulares.portero===id;
  return started || m.events.some(e => e.jugador===id);
}

/* ============================================================
   MUTACIONES
   ============================================================ */
function addEvent(tipo, jugador){
  const m = activeMatch(); if(!m) return;
  const e = {id:uid(), t:Date.now(), periodo:m.periodo||1, tipo, jugador:jugador||null};
  m.events.push(e);
  save(); vibrate(14);
  toast(actionText(e), true, actionTone(e.tipo));
  render();
}
function actionText(e){
  const a = ACC[e.tipo];
  if(e.tipo==="golRival") return "Gol del rival";
  const p = e.jugador ? player(e.jugador) : null;
  return (a?a.label:e.tipo) + (p ? " · "+p.apodo : "");
}
function undoLast(){
  const m = activeMatch(); if(!m || !m.events.length) return;
  const e = m.events.pop();
  save();
  toast("Deshecho: " + actionText(e), false);
  render();
}
function deleteEvent(eid){
  const m = activeMatch(); if(!m) return;
  m.events = m.events.filter(e => e.id!==eid);
  save(); render();
}
function askDeleteMatch(id){
  const m = matchById(id);
  if(!m) return;
  if(activeMatch() && activeMatch().id===id){
    alertModal("Este partido está en curso", "Finalízalo antes de poder eliminarlo.");
    return;
  }
  const s = score(m);
  const meta = [m.rival||"Partido", `${s.nos}-${s.riv}`, fmtDate(m.fecha)].filter(Boolean).join(" · ");
  confirmModal({
    title:"¿Eliminar este partido?",
    body:`${meta} — se borran también todas sus estadísticas. No se puede deshacer.`,
    confirmText:"Eliminar", danger:true
  }).then(ok=>{
    if(!ok) return;
    S.matches = S.matches.filter(x=>x.id!==id);
    save(); render();
    toast("Partido eliminado", false, "neg");
  });
}

let toastTimer=null;
function toast(text, undo, tone){
  const el = document.getElementById("toast");
  document.getElementById("toastText").textContent = text;
  document.getElementById("toastUndo").style.display = undo ? "" : "none";
  document.getElementById("toastDot").className = "dot" + (tone?" "+tone:"");
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 3600);
}
document.getElementById("toastUndo").addEventListener("click", ()=>{
  undoLast();
  document.getElementById("toast").classList.remove("show");
});

/* ============================================================
   MODAL de confirmación/aviso propio (sustituye a confirm()/alert() nativos)
   ============================================================ */
function confirmModal(opts){
  return new Promise(resolve=>{
    const ov = document.createElement("div"); ov.className="overlay"; ov.id="confirmOv";
    const btnsHtml = opts.onlyOk
      ? `<button class="btn gold" data-cm="ok" style="width:100%">${esc(opts.confirmText||"Entendido")}</button>`
      : `<div class="crow">
          <button class="btn ghost" data-cm="cancel">${esc(opts.cancelText||"Cancelar")}</button>
          <button class="btn ${opts.danger?'danger2':'gold'}" data-cm="ok">${esc(opts.confirmText||"Confirmar")}</button>
        </div>`;
    ov.innerHTML = `<div class="sheet"><div class="cmodal">
      ${opts.danger?`<div class="cicon">${ic('trash',22)}</div>`:''}
      <h3>${esc(opts.title||"")}</h3>
      ${opts.body?`<p>${esc(opts.body)}</p>`:''}
      ${btnsHtml}
    </div></div>`;
    function done(v){ ov.remove(); resolve(v); }
    ov.addEventListener("click", e=>{
      if(e.target===ov) return done(false);
      const b = e.target.closest("[data-cm]");
      if(!b) return;
      done(b.dataset.cm==="ok");
    });
    document.body.appendChild(ov);
  });
}
function alertModal(title, body){ return confirmModal({title, body, onlyOk:true}); }

function render(){
  let html = "";
  if(V.name==="home") html = viewHome();
  else if(V.name==="nuevo") html = viewNuevo();
  else if(V.name==="match") html = viewMatch();
  else if(V.name==="export") html = viewExport();
  else if(V.name==="temporada") html = viewTemporada();
  else if(V.name==="plantilla") html = viewPlantilla();
  else if(V.name==="ajustes") html = viewAjustes();
  else html = viewHome();
  app.innerHTML = html;
  window.scrollTo(0, V._scroll||0);
}
function go(name, extra){ V = Object.assign({name}, extra||{}); render(); }

/* ---------- HOME ---------- */
function viewHome(){
  const am = activeMatch();
  const done = S.matches.filter(m => m.finalizado).sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||"") || b.created-a.created);
  let list = "";
  if(am){
    const s = score(am);
    list += `<div class="mrow" data-a="openMatch" data-id="${am.id}">
        <span class="res">${s.nos}–${s.riv}</span>
        <span class="vs"><b>${esc(am.rival||"Partido en curso")}</b><span>${esc(am.comp||"")} · ${fmtDate(am.fecha)}</span></span>
        <span class="tag live">En juego</span>
      </div>`;
  }
  list += done.map(m=>{
    const s = score(m);
    const cls = s.nos>s.riv?"win":s.nos<s.riv?"lose":"draw";
    const txt = s.nos>s.riv?"Victoria":s.nos<s.riv?"Derrota":"Empate";
    return `<div class="mrow" data-a="openMatch" data-id="${m.id}">
      <span class="res">${s.nos}–${s.riv}</span>
      <span class="vs"><b>${esc(m.rival||"—")}</b><span>${esc(m.comp||"")} · ${fmtDate(m.fecha)}</span></span>
      <span class="tag ${cls}">${txt}</span></div>`;
  }).join("");
  if(!done.length && !am) list = `<div class="pad center muted">Todavía no hay partidos.<br>Pulsa <b>Nuevo partido</b> para empezar.</div>`;

  return topbar("Arteixo Balonmán") + `<main>
    <button class="btn gold" data-a="go" data-v="nuevo">${ic('plus',18)} Nuevo partido</button>
    <div class="navrow">
      <button class="navcard" data-a="go" data-v="temporada">${ic('chart',20)}<span>Temporada</span></button>
      <button class="navcard" data-a="go" data-v="plantilla">${ic('users',20)}<span>Plantilla</span></button>
      <button class="navcard" data-a="go" data-v="ajustes">${ic('gear',20)}<span>Ajustes</span></button>
    </div>
    <h2 class="sec">Partidos</h2>
    <div class="card">${list}</div>
    ${(done.length||am) ? '<p class="note" style="margin-top:10px">Mantén pulsado un partido para eliminarlo (borra también sus estadísticas).</p>' : ''}
    <p class="note" style="margin-top:10px">Los datos se guardan solo en este móvil/navegador. Haz una <b>copia de seguridad</b> desde Ajustes de vez en cuando.</p>
  </main>`;
}

/* ---------- NUEVO PARTIDO ---------- */
function draftInit(){
  if(V.draft) return;
  const seniors = S.roster.filter(p=>p.cat==="senior").map(p=>p.id);
  V.draft = {rival:"", fecha:new Date().toISOString().slice(0,10), comp:"", sede:"casa",
             conv:new Set(seniors), juv:false, titulares:{campo:[], portero:null}};
}
function viewNuevo(){
  draftInit();
  const d = V.draft;
  const list = ids => ids.map(id=>{
    const p = player(id); const on = d.conv.has(id);
    return `<div class="pitem" data-a="conv" data-id="${id}">
      ${avatar(p)}
      <span class="nm"><b>${esc(p.apodo)}</b><span>${esc(p.nombre)}</span></span>
      <span class="role ${p.puesto==='campo'?'field':''}">${p.puesto==="portero"?"POR":"CAMPO"}</span>
      <span class="chk ${on?'on':''}">${on?'✓':''}</span></div>`;
  }).join("");
  const seniors = S.roster.filter(p=>p.cat==="senior").map(p=>p.id);
  const juvs = S.roster.filter(p=>p.cat==="juvenil").map(p=>p.id);

  const convArr = [...d.conv];
  const gkChosen = d.titulares.portero;
  const pickable = convArr.filter(id => id!==gkChosen && !d.titulares.campo.includes(id));
  const chosenChips = [
    ...(gkChosen?[gkChosen]:[]),
    ...d.titulares.campo
  ].map(id=>{
    const p=player(id);
    return `<button class="btn sm ${p.puesto==='portero'?'gold':'soft'}" data-a="unpick" data-id="${id}">${esc(p.apodo)} ✕</button>`;
  }).join("");

  const nConv = d.conv.size;

  return topbar("Nuevo partido", `<button class="hbtn" data-a="go" data-v="home">Cancelar</button>`) + `<main>
    <div class="card pad">
      <div class="field"><label>Rival</label><input type="text" id="f_rival" placeholder="Ej.: Balonmán Culleredo" value="${esc(d.rival)}"></div>
      <div class="row" style="gap:10px">
        <div class="field grow"><label>Fecha</label><input type="date" id="f_fecha" value="${esc(d.fecha)}"></div>
        <div class="field grow"><label>Jornada / competición</label><input type="text" id="f_comp" placeholder="J5 · Liga" value="${esc(d.comp)}"></div>
      </div>
      <div class="field"><label>Dónde se juega</label>
        <div class="seg" id="f_sede">
          <button data-a="setSede" data-sede="casa" class="${d.sede==='casa'?'on':''}">🏠 Casa</button>
          <button data-a="setSede" data-sede="fuera" class="${d.sede==='fuera'?'on':''}">🚌 Fuera</button>
        </div>
      </div>
    </div>

    <h2 class="sec">Convocatoria (${nConv})</h2>
    <div class="card"><div class="plist">${list(seniors)}</div></div>

    <div class="pitem card" style="margin-top:8px;border-radius:15px" data-a="toggleJuv">
      <span class="nm"><b>Convocar juveniles</b><span>Añade a los juveniles que jueguen este partido</span></span>
      <span class="chk ${d.juv?'on':''}">${d.juv?'✓':''}</span>
    </div>
    ${d.juv ? `<div class="card" style="margin-top:8px"><div class="plist">${list(juvs)}</div></div>` : ""}

    <h2 class="sec">Alineación inicial <span class="soft">(solo informativo)</span></h2>
    <div class="card pad">
      <p class="muted" style="margin:0 0 8px">Elige quién empieza en la portería (obligatorio) y, si quieres, hasta 6 de campo. Es solo un dato para las estadísticas: <b>durante el partido todos los convocados están igual de accesibles</b>, sin gestionar cambios.</p>
      <div class="row" style="flex-wrap:wrap;gap:8px">${chosenChips || '<span class="muted">Nadie elegido todavía</span>'}</div>
      <div class="row" style="flex-wrap:wrap;gap:8px;margin-top:10px">
        ${pickable.map(id=>{
          const p=player(id);
          const dis = p.puesto==="campo" && d.titulares.campo.length>=6;
          return `<button class="btn sm ${p.puesto==='portero'?'ghost':'soft'}" data-a="pick" data-id="${id}" ${dis?'disabled':''}>${esc(p.apodo)}${p.puesto==='portero'?' 🧤':''}</button>`;
        }).join("")}
      </div>
    </div>

    <p class="note">Necesitas escribir el rival y elegir qué portero empieza.</p>
    <div class="fab"><button class="btn gold" data-a="startMatch">▶️ Empezar partido</button></div>
  </main>`;
}

/* ---------- MATCH ---------- */
function viewMatch(){
  const m = activeMatch();
  if(!m) return viewHome();
  const tab = V.tab || "pista";
  const s = score(m);
  const sd = m.descansoAt ? score(m,1) : null;
  const st = streak(m);
  const gk = player(m.porteroActivo);
  const gks = m.convocados.filter(id => player(id).puesto==="portero");

  const scoreboard = `<div class="score">
    <div class="teams"><span class="n">${crestHTML(20)} Arteixo</span><span class="n r">${esc(m.rival||"Rival")}</span></div>
    <div class="big">${s.nos}<span class="sep">–</span>${s.riv}</div>
    <div class="meta">
      <span>${m.periodo===2?"2ª parte":"1ª parte"}${sd?` · desc. ${sd.nos}–${sd.riv}`:""}</span>
      ${st.n>=2 ? `<span class="streak ${st.team==='riv'?'riv':''}">${st.team==='riv'?'Rival':'Nosotros'} ${st.n} seguidos</span>` : `<span class="muted" style="color:#cdd3f0">Racha —</span>`}
    </div>
  </div>`;

  const gkHead = `<div class="gkhead">
    <div class="gkwho">${gk?avatar(gk):''}<b>${gk?esc(gk.apodo):'Sin portero'}</b><span class="muted">en portería</span></div>
    ${gks.length>1 ? `<button class="gkswitch" data-a="gkSwitchBtn">${ic('swap',14)} Cambiar</button>` : ''}
  </div>`;
  const gkbtns = `${gkHead}<div class="gkgrid">
    <button class="gkbtn save" data-a="gk" data-tipo="parada">🧤 Parada</button>
    <button class="gkbtn conc" data-a="gk" data-tipo="golEncajado">🥅 Gol encajado</button>
    <button class="gkbtn save" data-a="gk" data-tipo="parada7m">🧤 Parada 7m</button>
    <button class="gkbtn conc" data-a="gk" data-tipo="golEnc7m">🥅 Gol 7m encajado</button>
    <button class="gkbtn riv" data-a="rivgoal">${ic('plus',15)} Gol del rival (sin portero)</button>
  </div>`;

  const tabs = `<div class="tabs">
    ${[["pista","Pista","users"],["timeline","Timeline","activity"],["stats","Stats","chart"],["registro","Registro","list"]]
      .map(([t,label,icon])=>`<button data-a="tab" data-t="${t}" class="${tab===t?'on':''}">${ic(icon,15)}${label}</button>`).join("")}
  </div>`;

  let body="";
  if(tab==="pista"){
    const mode = V.pistaMode || "jugadores";
    body = `<div class="seg" style="margin-bottom:12px">
      <button data-a="pistaMode" data-m="jugadores" class="${mode==='jugadores'?'on':''}">${ic('users',15)} Jugadores</button>
      <button data-a="pistaMode" data-m="acciones" class="${mode==='acciones'?'on':''}">${ic('bolt',15)} Acciones</button>
    </div>`;
    if(mode==="jugadores"){
      body += `<div class="court">` + m.convocados.map(id=>{
        const p=player(id);
        const tit = (m.titulares.campo||[]).includes(id) || m.titulares.portero===id;
        return `<button class="pcard" data-a="player" data-id="${id}">
          ${tit?'<span class="tstar">★</span>':''}
          ${avatar(p,"big")}
          <span class="nick">${esc(p.apodo)}</span>
          <span class="full">${esc(p.corto)}</span>
        </button>`;
      }).join("") + `</div>`;
      if(!m.convocados.length) body += `<div class="note">No hay convocados. Añade jugadores desde Plantilla.</div>`;
    } else {
      body += FIELD_GROUPS.map(([h,keys])=> `<div class="agroup"><h4>${h}</h4><div class="agrid">
        ${keys.map(k=>`<button class="abtn ${actionCls(k)}" data-a="pickForAction" data-tipo="${k}">${ACC[k].label}</button>`).join("")}
      </div></div>`).join("");
      body += `<p class="note" style="margin-top:14px">Elige una acción y después el jugador. Solo para jugadores de campo — las de portero están arriba.</p>`;
    }
  }
  else if(tab==="timeline"){
    const rs = runs(m);
    if(!rs.length) body = `<div class="note">Aún no hay goles. Las rachas y parciales aparecerán aquí.</div>`;
    else {
      const t0 = m.events[0] ? m.events[0].t : Date.now();
      body = `<div class="tl">` + rs.map(r=>{
        const bars = Array.from({length:Math.min(r.count,12)}).map(()=>`<span class="b ${r.team}"></span>`).join("");
        const secs = Math.round((r.t1-r.t0)/1000);
        const span = r.count>1 ? ` en ${Math.max(1,Math.round(secs/60))}′` : "";
        const who = r.team==="n" ? "Arteixo" : (m.rival||"Rival");
        return `<div class="run ${r.count>=3?'big':''}">
          <div class="bars">${bars}</div>
          <div class="txt"><b>${who} ${r.count>1?`× ${r.count}`:""}</b>${span}<br><span class="muted">${r.per===2?"2ª parte":"1ª parte"} · min ${relTime(r.t0,t0).replace("′","")}</span></div>
          <div class="sc">${r.sN}–${r.sR}</div>
        </div>`;
      }).join("") + `</div>`;
    }
  }
  else if(tab==="stats"){
    body = statsBlock(m, false);
  }
  else if(tab==="registro"){
    const t0 = m.events[0]?m.events[0].t:Date.now();
    body = `<div class="card"><div class="log">` + (m.events.length? m.events.slice().reverse().map(e=>{
      const p = e.jugador?player(e.jugador):null;
      const rg = THEIRS.includes(e.tipo);
      return `<div class="lg ${rg?'rivgoal':''}">
        <span class="t">${relTime(e.t,t0)}</span>
        <span class="d"><b>${esc(ACC[e.tipo]?ACC[e.tipo].label:e.tipo)}</b>${p?` · ${esc(p.apodo)}`:""}<br><span class="muted" style="font-size:11px">${e.periodo===2?"2ª":"1ª"} parte</span></span>
        <button class="del" data-a="delEvent" data-id="${e.id}">Borrar</button>
      </div>`;
    }).join("") : '<div class="pad muted center">Sin acciones registradas.</div>') + `</div></div>`;
  }

  const foot = `<div class="fab">
    <button class="btn ghost" data-a="undo">${ic('undo',16)} Deshacer</button>
    ${m.periodo===1
      ? `<button class="btn soft" data-a="descanso">${ic('pause',14)} Descanso</button>`
      : `<span class="grow"></span>`}
    <button class="btn" data-a="finalizar">${ic('flag',16)} Finalizar</button>
  </div>`;

  return topbar((m.rival?("vs "+m.rival):"Partido"), `<button class="hbtn" data-a="go" data-v="home">Inicio</button>`) + `<main>
    ${scoreboard}
    ${gkbtns}
    ${gk?"":`<p class="note" style="margin-top:8px">No hay portero activo. Convoca uno y usa <b>Cambiar</b>.</p>`}
    ${tabs}
    ${body}
    ${foot}
  </main>`;
}

function statsBlock(m, forPrint){
  const ts = teamStats(m);
  const hl = highlights(m);
  const kpi = (k,o) => `<div class="kpi"><div class="k">${k}</div><div class="v">${o.pct}%</div><div class="s">${o.n}/${o.d}</div></div>`;
  const flt = forPrint ? (ids => ids.filter(id => played(m,id))) : (ids => ids);
  const campoRows = flt(ts.campo).map(id=>playerStats(m,id)).sort((a,b)=> b.val-a.val);
  const gkRows = flt(ts.gk).map(id=>playerStats(m,id)).sort((a,b)=> b.val-a.val);

  const tCampo = `<div class="twrap"><table class="st">
    <thead><tr>
      <th class="name">Jugador</th><th>Goles</th><th>T.par</th><th>T.fuera</th><th>%Tiro</th>
      <th>7m G/F</th><th>7m prov</th><th>Pérd</th><th>Recup</th><th>Bloc</th><th>2m/Tj</th><th>Valor</th>
    </tr></thead><tbody>
    ${campoRows.map(r=>`<tr>
      <td class="name">${esc(labelPDF(r.p))}</td>
      <td><b>${r.goles}</b>${r.contra?` <span class="muted">(${r.contra}CA)</span>`:""}</td>
      <td>${r.tp||""}</td><td>${r.tf||""}</td><td>${r.tiros?r.pctTiro+"%":"—"}</td>
      <td>${r.l7?`${r.g7}/${r.f7}`:"—"}</td><td>${r.prov7||""}</td>
      <td class="${r.perdidas?'neg':''}">${r.perdidas||""}</td>
      <td class="${r.recup?'pos':''}">${r.recup||""}</td>
      <td class="${r.blocaje?'pos':''}">${r.blocaje||""}</td>
      <td>${[r.dosmin?r.dosmin+"×2′":"",r.amarilla?"A":"",r.roja?'<span style="color:var(--bad);font-weight:900">R</span>':""].filter(Boolean).join(" ")||""}</td>
      <td class="val ${r.val>0?'pos':r.val<0?'neg':''}">${r.val.toFixed(1)}</td>
    </tr>`).join("")}
    </tbody></table></div>`;

  const tGk = gkRows.length ? `<h2 class="sec">Porteros</h2><div class="twrap"><table class="st">
    <thead><tr><th class="name">Portero</th><th>Paradas</th><th>Gol enc.</th><th>%Par</th><th>Par.7m</th><th>Gol7m enc</th><th>%7m</th><th>Asist</th><th>Gol</th><th>Valor</th></tr></thead>
    <tbody>${gkRows.map(r=>`<tr>
      <td class="name">${esc(labelPDF(r.p))}</td>
      <td><b>${r.paradas}</b></td><td class="${r.enc?'neg':''}">${r.enc||""}</td>
      <td>${(r.paradas+r.enc)?r.pctPar+"%":"—"}</td>
      <td>${r.par7||""}</td><td>${r.enc7||""}</td><td>${(r.par7+r.enc7)?r.pctPar7+"%":"—"}</td>
      <td>${r.asist||""}</td><td>${r.golGk||""}</td>
      <td class="val ${r.val>0?'pos':r.val<0?'neg':''}">${r.val.toFixed(1)}</td>
    </tr>`).join("")}</tbody></table></div>` : "";

  const mvpBox = hl.mvp ? `<div class="mvp">
    <div class="lbl">🏆 MVP DEL PARTIDO</div>
    <div class="who">${esc(labelPDF(hl.mvp.p))}</div>
    <div>Valoración ${hl.mvp.st.val.toFixed(1)} · ${hl.mvp.st.goles} goles · ${hl.mvp.st.recup+hl.mvp.st.blocaje} acc. defensivas</div>
  </div>` : `<div class="note">MVP: se calcula cuando haya acciones suficientes.</div>`;

  const hlRow = (em,txt,who,val)=> who ? `<div class="hl"><span class="em">${em}</span><span>${txt}: <b style="font-weight:800">${esc(who)}</b></span><b>${val}</b></div>` : "";
  const hlBox = `<div class="card" style="margin-top:10px">
    ${hlRow("🥇","Máximo goleador", hl.goleador && (hl.goleador.st.goles+hl.goleador.st.g7)>0 ? hl.goleador.p.apodo : "", hl.goleador?(hl.goleador.st.goles+hl.goleador.st.g7):"")}
    ${hlRow("🧱","Mejor en defensa", hl.defensor && (hl.defensor.st.recup+hl.defensor.st.blocaje)>0 ? hl.defensor.p.apodo : "", hl.defensor?(hl.defensor.st.recup+hl.defensor.st.blocaje):"")}
    ${hlRow("⚡","Más asistencias", hl.asis && hl.asis.st.asist>0 ? hl.asis.p.apodo : "", hl.asis?hl.asis.st.asist:"")}
    ${hlRow("🧤","Portero del partido", hl.portero && (hl.portero.st.paradas+hl.portero.st.enc)>0 ? hl.portero.p.apodo : "", hl.portero&&(hl.portero.st.paradas+hl.portero.st.enc)>0 ? hl.portero.st.pctPar+"%" : "")}
  </div>`;

  return `
    ${mvpBox}
    ${hlBox}
    <h2 class="sec">Porcentajes del equipo</h2>
    <div class="kpis">
      ${kpi("Acierto en tiro", ts.tiro)}
      ${kpi("Acierto en 7m", ts.siete)}
      ${kpi("Paradas portería", ts.paradas)}
      ${kpi("Paradas de 7m", ts.paradas7)}
    </div>
    <h2 class="sec">Jugadores de campo</h2>
    ${tCampo}
    ${tGk}
    ${forPrint?"":'<p class="note" style="margin-top:12px">Desliza las tablas para ver todas las columnas.</p>'}
  `;
}

      <div class="big">${s.nos}<span class="sep">–</span>${s.riv}</div>

        <button class="btn soft sm" data-a="printPdf" data-id="${m.id}">${ic('print',15)} Guardar como PDF</button>

}

/* ---------- TEMPORADA ---------- */
function seasonAgg(){
  const done = S.matches.filter(m=>m.finalizado);
  const per = {};
  for(const m of done){
    for(const id of m.convocados){
      const st = playerStats(m,id);
      const a = per[id] || (per[id]={p:player(id), pj:0, goles:0,g7:0,tp:0,tf:0,tiros:0,prov7:0,perdidas:0,recup:0,blocaje:0,dosmin:0,amarilla:0,roja:0,paradas:0,enc:0,par7:0,enc7:0,asist:0,golGk:0,val:0});
      a.pj++;
      for(const k of ["goles","g7","tp","tf","tiros","prov7","perdidas","recup","blocaje","dosmin","amarilla","roja","paradas","enc","par7","enc7","asist","golGk","val"]) a[k]+=st[k];
    }
  }
  return {done, rows:Object.values(per).sort((a,b)=> b.val-a.val)};
}
function viewTemporada(){
  const {done, rows} = seasonAgg();
  if(!done.length) return topbar("Temporada",`<button class="hbtn" data-a="go" data-v="home">Inicio</button>`)+`<main><div class="note">Aún no hay partidos finalizados.</div></main>`;
  let w=0,l=0,d=0, gf=0, gc=0;
  for(const m of done){ const s=score(m); gf+=s.nos; gc+=s.riv; if(s.nos>s.riv)w++;else if(s.nos<s.riv)l++;else d++; }
  const tbl = `<div class="twrap"><table class="st"><thead><tr>
    <th class="name">Jugador</th><th>PJ</th><th>Goles</th><th>7m</th><th>T.par</th><th>T.fuera</th><th>%Tiro</th><th>Pérd</th><th>Recup</th><th>Bloc</th><th>Paradas</th><th>%Par</th><th>Valor</th>
  </tr></thead><tbody>
  ${rows.map(r=>`<tr>
    <td class="name">${esc(labelPDF(r.p))}</td><td>${r.pj}</td>
    <td><b>${r.goles}</b></td><td>${r.g7||""}</td><td>${r.tp||""}</td><td>${r.tf||""}</td>
    <td>${r.tiros?pct(r.goles,r.tiros)+"%":"—"}</td>
    <td class="${r.perdidas?'neg':''}">${r.perdidas||""}</td>
    <td class="${r.recup?'pos':''}">${r.recup||""}</td><td class="${r.blocaje?'pos':''}">${r.blocaje||""}</td>
    <td>${r.paradas||""}</td><td>${(r.paradas+r.enc)?pct(r.paradas,r.paradas+r.enc)+"%":"—"}</td>
    <td class="val ${r.val>0?'pos':r.val<0?'neg':''}">${r.val.toFixed(1)}</td>
  </tr>`).join("")}
  </tbody></table></div>`;
  return topbar("Temporada",`<button class="hbtn" data-a="go" data-v="home">Inicio</button>`)+`<main>
    <div class="kpis">
      <div class="kpi"><div class="k">Partidos</div><div class="v">${done.length}</div><div class="s">${w}V · ${d}E · ${l}D</div></div>
      <div class="kpi"><div class="k">Goles</div><div class="v">${gf}–${gc}</div><div class="s">media ${(gf/done.length).toFixed(1)}–${(gc/done.length).toFixed(1)}</div></div>
    </div>
    <h2 class="sec">Acumulado por jugador</h2>
    ${tbl}
    <div class="fab"><button class="btn gold" data-a="seasonPng">${ic('share',16)} Compartir imagen</button></div>
  </main>`;
}

/* ============================================================
   SHEET de acciones por jugador
   ============================================================ */
function openSheet(pid){
  const p = player(pid);
  const m = activeMatch(); if(!m) return;
  const grp = keys => keys.map(k=>
    `<button class="abtn ${actionCls(k)}" data-a="sheetAct" data-tipo="${k}">${ACC[k].label}</button>`
  ).join("");
  const groups = (p.puesto==="portero" ? GK_GROUPS : FIELD_GROUPS)
    .map(([h,keys])=> `<div class="agroup"><h4>${h}</h4><div class="agrid">${grp(keys)}</div></div>`).join("");
  const ov = document.createElement("div");
  ov.className="overlay"; ov.id="sheetOv";
  ov.innerHTML = `<div class="sheet">
    <div class="shhead">${avatar(p,"big")}<div><div class="nick">${esc(p.apodo)}</div><div class="muted">${esc(p.nombre)}</div></div>
      <button class="x" data-a="closeSheet">Cerrar</button></div>
    ${groups}
  </div>`;
  ov.addEventListener("click", e=>{ if(e.target===ov) closeSheet(); });
  document.body.appendChild(ov);
  V._sheet = pid;
}
function closeSheet(){ const o=document.getElementById("sheetOv"); if(o) o.remove(); V._sheet=null; }

/* ---------- Cambio de portero ---------- */
function openGkSwitch(){
  const m = activeMatch(); if(!m) return;
  const gks = m.convocados.filter(id=>player(id).puesto==="portero");
  if(gks.length<=1){ toast("No hay otro portero convocado", false); return; }
  if(gks.length===2){
    const other = gks.find(x=>x!==m.porteroActivo) || gks[0];
    m.porteroActivo = other; save();
    toast("En portería: "+player(other).apodo, false); render();
    return;
  }
  const ov = document.createElement("div"); ov.className="overlay"; ov.id="sheetOv";
  ov.innerHTML = `<div class="sheet">
    <div class="shhead"><div class="nick">Cambiar portero</div><button class="x" data-a="closeSheet">Cerrar</button></div>
    <div class="court" style="margin-top:2px">
      ${gks.map(id=>{const p=player(id); const on=id===m.porteroActivo;
        return `<button class="pcard ${on?'sel':''}" data-a="setGk" data-id="${id}">${avatar(p,'big')}<span class="nick">${esc(p.apodo)}</span>${on?'<span class="mini">EN PORTERÍA</span>':''}</button>`;}).join("")}
    </div>
  </div>`;
  ov.addEventListener("click", e=>{ if(e.target===ov) closeSheet(); });
  document.body.appendChild(ov);
}

/* ============================================================
   EXPORTACIÓN: imagen (canvas), PDF (print), CSV, backup
   ============================================================ */
function drawReport(m, opts){
  opts = opts||{};
  const W = 1000;
  const ts = teamStats(m);
  const hl = highlights(m);
  const s = score(m);
  const sd = m.descansoAt ? score(m,1) : null;
  const campoRows = ts.campo.filter(id=>played(m,id)).map(id=>playerStats(m,id)).sort((a,b)=>b.val-a.val);
  const gkRows = ts.gk.filter(id=>played(m,id)).map(id=>playerStats(m,id)).sort((a,b)=>b.val-a.val);
  const incPerd = opts.incPerd!==false;

  const R = 2;
  const cv = document.createElement("canvas");
  cv.width = W*R; cv.height = 6000*R;
  const x = cv.getContext("2d");
  x.scale(R,R);
  x.textBaseline = "middle";
  const F = (s,w)=> `${w||""} ${s}px -apple-system,"Segoe UI",Roboto,Arial,sans-serif`;

  x.fillStyle="#ffffff"; x.fillRect(0,0,W,6000);

  x.fillStyle="#1b2a6b"; x.fillRect(0,0,W,200);
  x.fillStyle="#ffd400"; x.fillRect(0,200,W,6);
  if(_crestImg && _crestImg.complete && _crestImg.naturalWidth){
    x.save(); x.beginPath(); x.arc(72,66,32,0,Math.PI*2); x.clip();
    x.drawImage(_crestImg,40,34,64,64); x.restore();
  } else {
    x.beginPath(); x.arc(72,66,32,0,Math.PI*2);
    const grad = x.createRadialGradient(60,54,4,72,66,34);
    grad.addColorStop(0,"#ffe670"); grad.addColorStop(1,"#ffd400");
    x.fillStyle=grad; x.fill();
    x.lineWidth=3; x.strokeStyle="#1b2a6b"; x.stroke();
    x.fillStyle="#1b2a6b"; x.font=F(22,"900"); x.textAlign="center";
    x.fillText("AB", 72, 62);
    x.font=F(8,"700"); x.fillText("2014", 72, 78);
    x.textAlign="left";
  }
  const hx = 124;
  x.fillStyle="#ffffff"; x.font=F(28,"800");
  x.fillText(S.team.name.toUpperCase(), hx, 52);
  x.font=F(21,"600"); x.fillStyle="#cdd3f0";
  x.fillText(`vs ${m.rival||"Rival"}`, hx, 90);
  x.font=F(15,"");
  x.fillText([m.comp, fmtDate(m.fecha), m.sede==="casa"?"Casa":"Fuera"].filter(Boolean).join("  ·  "), hx, 122);
  x.textAlign="right"; x.fillStyle="#ffffff"; x.font=F(64,"900");
  x.fillText(`${s.nos} – ${s.riv}`, W-40, 74);
  if(sd){ x.font=F(15,"600"); x.fillStyle="#cdd3f0"; x.fillText(`descanso ${sd.nos} – ${sd.riv}`, W-40, 120); }
  x.textAlign="left";

  let y = 250;
  if(hl.mvp){
    x.fillStyle="#ffd400"; roundRect(x,40,y,W-80,90,14); x.fill();
    x.fillStyle="#1b2a6b"; x.font=F(14,"900"); x.fillText("🏆  MVP DEL PARTIDO", 62, y+26);
    x.font=F(26,"900"); x.fillText(labelPDF(hl.mvp.p), 62, y+58);
    x.textAlign="right"; x.font=F(15,"700");
    x.fillText(`Valoración ${hl.mvp.st.val.toFixed(1)}`, W-62, y+58); x.textAlign="left";
    y += 110;
  }
  const dz = [
    ["🥇 Goleador", hl.goleador && (hl.goleador.st.goles+hl.goleador.st.g7)>0 ? `${hl.goleador.p.apodo} (${hl.goleador.st.goles+hl.goleador.st.g7})` : "—"],
    ["🧱 Defensa",  hl.defensor && (hl.defensor.st.recup+hl.defensor.st.blocaje)>0 ? `${hl.defensor.p.apodo} (${hl.defensor.st.recup+hl.defensor.st.blocaje})` : "—"],
    ["⚡ Asist.",   hl.asis && hl.asis.st.asist>0 ? `${hl.asis.p.apodo} (${hl.asis.st.asist})` : "—"],
    ["🧤 Portero",  hl.portero && (hl.portero.st.paradas+hl.portero.st.enc)>0 ? `${hl.portero.p.apodo} (${hl.portero.st.pctPar}%)` : "—"],
  ];
  x.font=F(15,"");
  dz.forEach((d,i)=>{
    const cx = 40 + i*((W-80)/4);
    x.fillStyle="#5b6178"; x.font=F(12,"700"); x.fillText(d[0], cx, y+10);
    x.fillStyle="#171b2e"; x.font=F(16,"800"); x.fillText(d[1], cx, y+34);
  });
  y += 66;

  x.fillStyle="#5b6178"; x.font=F(13,"800"); x.fillText("PORCENTAJES DEL EQUIPO", 40, y+8); y+=24;
  const kp = [
    ["Acierto en tiro", ts.tiro], ["Acierto en 7m", ts.siete],
    ["Paradas portería", ts.paradas], ["Paradas de 7m", ts.paradas7],
  ];
  kp.forEach((k,i)=>{
    const cx = 40 + i*((W-80)/4);
    x.strokeStyle="#e4e6ee"; roundRect(x,cx,y,((W-80)/4)-12,74,10); x.stroke();
    x.fillStyle="#5b6178"; x.font=F(11,"700"); x.fillText(k[0], cx+12, y+16);
    x.fillStyle="#171b2e"; x.font=F(24,"900"); x.fillText(k[1].pct+"%", cx+12, y+44);
    x.fillStyle="#5b6178"; x.font=F(12,""); x.fillText(`${k[1].n}/${k[1].d}`, cx+12, y+62);
  });
  y += 98;

  // Línea de tiempo / parciales
  const goalsSeq = m.events.filter(e => OURS.includes(e.tipo) || THEIRS.includes(e.tipo));
  if(goalsSeq.length){
    x.fillStyle="#5b6178"; x.font=F(13,"800"); x.fillText("LÍNEA DE TIEMPO", 40, y+8); y+=24;
    const avail = W-80;
    const bw = Math.max(6, Math.min(16, avail/goalsSeq.length - 3));
    let bx = 40;
    goalsSeq.forEach(e=>{
      x.fillStyle = OURS.includes(e.tipo) ? "#1b2a6b" : "#d64545";
      roundRect(x, bx, y, bw, 22, 3); x.fill();
      bx += bw + 3;
    });
    y += 36;
    const bigRuns = runs(m).filter(r=>r.count>=3);
    if(bigRuns.length){
      x.font=F(13,"600"); x.fillStyle="#171b2e";
      const rtxt = bigRuns.map(r=> (r.team==="n"?"Arteixo":m.rival||"Rival")+" ×"+r.count).join("   ·   ");
      x.fillText("Rachas: "+rtxt, 40, y);
      y += 26;
    } else { y += 6; }
  }

  const campoCols = [
    ["Jugador", 250, r=>labelPDF(r.p), "l"],
    ["Goles", 62, r=> r.contra? `${r.goles} (${r.contra})` : String(r.goles)],
    ["T.par", 58, r=> r.tp||""],
    ["T.fuera", 66, r=> r.tf||""],
    ["% Tiro", 70, r=> r.tiros? r.pctTiro+"%":"—"],
    ["7m G/F", 70, r=> r.l7? `${r.g7}/${r.f7}`:"—"],
    ["Recup", 62, r=> r.recup||""],
    ["Bloc", 55, r=> r.blocaje||""],
  ];
  if(incPerd) campoCols.push(["Pérd", 60, r=> r.perdidas||""]);
  campoCols.push(["2m", 45, r=> r.dosmin||""]);
  campoCols.push(["Valor", 70, r=> r.val.toFixed(1)]);
  y = drawTable(x, 40, y, W-80, "JUGADORES DE CAMPO", campoCols, campoRows);

  if(gkRows.length){
    y += 18;
    const gkCols = [
      ["Portero", 240, r=>labelPDF(r.p), "l"],
      ["Paradas", 90, r=> String(r.paradas)],
      ["Gol enc.", 90, r=> r.enc||""],
      ["% Par", 80, r=> (r.paradas+r.enc)? r.pctPar+"%":"—"],
      ["Par.7m", 80, r=> r.par7||""],
      ["Gol7m e.", 90, r=> r.enc7||""],
      ["% 7m", 70, r=> (r.par7+r.enc7)? r.pctPar7+"%":"—"],
      ["Asist", 60, r=> r.asist||""],
      ["Gol", 50, r=> r.golGk||""],
      ["Valor", 70, r=> r.val.toFixed(1)],
    ];
    y = drawTable(x, 40, y, W-80, "PORTEROS", gkCols, gkRows);
  }

  y += 34;
  x.fillStyle="#9aa0b4"; x.font=F(12,"");
  x.fillText(`${S.team.name} · generado ${new Date().toLocaleString("es-ES")} · app de estadísticas`, 40, y);
  y += 20;

  const out = document.createElement("canvas");
  out.width = W*R; out.height = Math.ceil(y)*R;
  out.getContext("2d").drawImage(cv, 0, 0, W*R, out.height, 0, 0, W*R, out.height);
  return out;
}
function roundRect(x,px,py,w,h,r){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); }
function drawTable(x, ox, oy, tw, title, cols, rows){
  const F = (s,w)=> `${w||""} ${s}px -apple-system,"Segoe UI",Roboto,Arial,sans-serif`;
  let y = oy;
  x.fillStyle="#5b6178"; x.font=F(13,"800"); x.fillText(title, ox, y+8); y+=22;
  const sum = cols.reduce((a,c)=>a+c[1],0);
  const scale = tw/sum;
  const cw = cols.map(c=> c[1]*scale);
  const rowH = 44;
  x.fillStyle="#f0f2f8"; x.fillRect(ox,y,tw,36);
  x.fillStyle="#5b6178"; x.font=F(12,"800");
  let cx = ox;
  cols.forEach((c,i)=>{
    x.textAlign = c[3]==="l" ? "left":"center";
    x.fillText(c[0], c[3]==="l"? cx+10 : cx+cw[i]/2, y+18);
    cx += cw[i];
  });
  y += 36;
  rows.forEach((r,ri)=>{
    if(ri%2) { x.fillStyle="#fafbfd"; x.fillRect(ox,y,tw,rowH); }
    x.fillStyle="#171b2e";
    let cx2 = ox;
    cols.forEach((c,i)=>{
      const v = String(c[2](r));
      x.font = (c[0]==="Valor") ? F(15,"900") : (c[3]==="l" ? F(15,"700") : F(15,""));
      if(c[0]==="Valor") x.fillStyle = r.val>0 ? "#1f9d55" : r.val<0 ? "#d64545" : "#171b2e";
      else x.fillStyle="#171b2e";
      x.textAlign = c[3]==="l" ? "left" : "center";
      x.fillText(v, c[3]==="l"? cx2+10 : cx2+cw[i]/2, y+rowH/2);
      cx2 += cw[i];
    });
    x.strokeStyle="#e4e6ee"; x.beginPath(); x.moveTo(ox,y+rowH); x.lineTo(ox+tw,y+rowH); x.stroke();
    y += rowH;
  });
  x.textAlign="left";
  return y;
}

function canvasToShare(cv, filename, title){
  cv.toBlob(async (blob)=>{
    if(!blob){ toast("No se pudo generar la imagen", false); return; }
    const file = new File([blob], filename, {type:"image/png"});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title, text:title});
        return;
      }
    }catch(e){ if(e && e.name==="AbortError") return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast("Imagen descargada · compártela en WhatsApp", false);
  }, "image/png");
}

function printReportHTML(m){
  const area = document.getElementById("printArea");
  const s = score(m);
  area.innerHTML = `
    <div style="font-family:-apple-system,Arial,sans-serif;color:#171b2e;padding:16px;max-width:900px">
      <div style="background:#1b2a6b;color:#fff;padding:16px;border-radius:10px;border-bottom:5px solid #ffd400">
        <div style="font-size:22px;font-weight:800">${esc(S.team.name.toUpperCase())} &nbsp; ${s.nos} – ${s.riv} &nbsp; ${esc(m.rival||"Rival")}</div>
        <div style="font-size:13px;opacity:.85">${esc([m.comp,fmtDate(m.fecha),m.sede==="casa"?"Casa":"Fuera"].filter(Boolean).join(" · "))}</div>
      </div>
      ${statsBlock(m,true)}
    </div>`;
  window.print();
}

function csvExport(m){
  const rows = [["#Partido", (m.rival||""), fmtDate(m.fecha), m.comp||""]];
  const s = score(m); rows.push(["Resultado", s.nos, s.riv]);
  rows.push([]);
  rows.push(["Jugador","Puesto","Goles","Contraataque","TiroParado","TiroFuera","%Tiro","Gol7m","Fallo7m","7mProvocado","Perdidas","Recuperaciones","Blocajes","7mCometido","2min","Amarillas","Rojas","Paradas","GolesEncajados","%Paradas","Parada7m","Gol7mEncajado","Asistencias","GolPortero","Valoracion"]);
  m.convocados.map(id=>playerStats(m,id)).sort((a,b)=>b.val-a.val).forEach(r=>{
    rows.push([r.p.nombre, r.p.puesto, r.goles, r.contra, r.tp, r.tf, r.tiros?r.pctTiro:"", r.g7, r.f7, r.prov7, r.perdidas, r.recup, r.blocaje, r.comete7, r.dosmin, r.amarilla, r.roja, r.paradas, r.enc, (r.paradas+r.enc)?r.pctPar:"", r.par7, r.enc7, r.asist, r.golGk, r.val.toFixed(2)]);
  });
  const csv = rows.map(r=> r.map(c=>{ c=String(c??""); return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(";")).join("\n");
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url;
  a.download = `estadisticas_${(m.rival||"partido").replace(/\W+/g,"-")}_${m.fecha||""}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

function backup(){
  const blob = new Blob([JSON.stringify(S,null,1)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url;
  a.download = `arteixo-balonman_copia_${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

/* ============================================================
   FILE PICKERS
   ============================================================ */
let photoTarget = null;
const filePick = document.getElementById("filePick");
filePick.addEventListener("change", ()=>{
  const f = filePick.files[0]; filePick.value="";
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const size = 220;
      const c = document.createElement("canvas"); c.width=c.height=size;
      const g = c.getContext("2d");
      const mn = Math.min(img.width,img.height);
      g.drawImage(img, (img.width-mn)/2, (img.height-mn)/2, mn, mn, 0,0,size,size);
      const data = c.toDataURL("image/jpeg",0.82);
      if(photoTarget==="__crest__"){ S.team.crest = data; preloadCrest(); }
      else {
        const p = player(photoTarget);
        if(p) p.foto = data;
      }
      save(); render();
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
});
const jsonPick = document.getElementById("jsonPick");
jsonPick.addEventListener("change", ()=>{
  const f = jsonPick.files[0]; jsonPick.value="";
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let obj;
    try{
      obj = JSON.parse(rd.result);
      if(!obj.roster || !obj.matches) throw 0;
    }catch(e){ alertModal("Archivo no válido", "No se pudo leer esta copia de seguridad."); return; }
    confirmModal({title:"Importar copia de seguridad", body:"Esto reemplaza la plantilla y todos los partidos de este móvil por los del archivo.", confirmText:"Importar", danger:true})
      .then(ok=>{
        if(!ok) return;
        S = obj;
        S.weights = Object.assign(defaultWeights(), S.weights||{});
        S.team = Object.assign({name:"Arteixo Balonmán",crest:null}, S.team||{});
        preloadCrest();
        save(); go("home");
        toast("Copia importada", false);
      });
  };
  rd.readAsText(f);
});

/* ============================================================
   ROUTER de clicks
   ============================================================ */
function readDraftInputs(){
  const d = V.draft; if(!d) return;
  const g = id => document.getElementById(id);
  if(g("f_rival")) d.rival = g("f_rival").value;
  if(g("f_fecha")) d.fecha = g("f_fecha").value;
  if(g("f_comp")) d.comp = g("f_comp").value;
}
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.a==="weight"){
    const v = parseFloat(t.value);
    if(!isNaN(v)){ S.weights[t.dataset.k]=v; save(); }
  }
  if(V.name==="nuevo" && V.draft){
    if(t.id==="f_rival") V.draft.rival = t.value;
    if(t.id==="f_comp")  V.draft.comp  = t.value;
    if(t.id==="f_fecha") V.draft.fecha = t.value;
  }
});
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-a]");
  if(!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  V._scroll = window.scrollY;

  switch(a){
    case "go":
      if(b.dataset.v==="nuevo" && activeMatch()){
        alertModal("Ya hay un partido en curso", "Finalízalo antes de empezar otro.");
        go("match",{tab:"pista"}); break;
      }
      go(b.dataset.v); break;
    case "openMatch": {
      const m = matchById(id);
      if(m && !m.finalizado) go("match");
      else go("export",{id});
      break;
    }
    /* ---- nuevo ---- */
    case "conv": {
      const s = V.draft.conv;
      s.has(id) ? s.delete(id) : s.add(id);
      render(); break;
    }
    case "toggleJuv": V.draft.juv = !V.draft.juv; render(); break;
    case "setSede": V.draft.sede = b.dataset.sede; render(); break;
    case "pick": {
      const p = player(id);
      if(p.puesto==="portero") V.draft.titulares.portero = (V.draft.titulares.portero===id?null:id);
      else if(!V.draft.titulares.campo.includes(id) && V.draft.titulares.campo.length<6) V.draft.titulares.campo.push(id);
      render(); break;
    }
    case "unpick": {
      if(V.draft.titulares.portero===id) V.draft.titulares.portero=null;
      V.draft.titulares.campo = V.draft.titulares.campo.filter(x=>x!==id);
      render(); break;
    }
    case "startMatch": {
      readDraftInputs();
      const d = V.draft;
      const sede = document.querySelector("#f_sede .on")?.dataset.sede || d.sede;
      if(!d.rival.trim()){ alertModal("Falta el rival", "Escribe el nombre del equipo rival."); break; }
      if(!d.titulares.portero){ alertModal("Falta el portero", "Convoca y elige qué portero empieza."); break; }
      const conv = [...d.conv];
      [d.titulares.portero, ...d.titulares.campo].forEach(x=>{ if(x && !conv.includes(x)) conv.push(x); });
      const m = {
        id:uid(), created:Date.now(), finalizado:false,
        rival:d.rival.trim(), fecha:d.fecha, comp:d.comp.trim(), sede,
        convocados:conv,
        titulares:{portero:d.titulares.portero, campo:d.titulares.campo.slice()},
        porteroActivo:d.titulares.portero,
        periodo:1, descansoAt:null,
        events:[],
      };
      S.matches.push(m);
      V.draft = null;
      save(); go("match",{tab:"pista"});
      break;
    }
    /* ---- match ---- */
    case "tab": V.tab = b.dataset.t; render(); break;
    case "pistaMode": V.pistaMode = b.dataset.m; render(); break;
    case "player": openSheet(id); break;
    case "closeSheet": closeSheet(); break;
    case "sheetAct": {
      addEvent(b.dataset.tipo, V._sheet);
      closeSheet();
      break;
    }
    case "pickForAction": openActionPicker(b.dataset.tipo); break;
    case "pickPlayerFor": {
      addEvent(b.dataset.tipo, id);
      closeSheet();
      break;
    }
    case "gk": {
      const m = activeMatch();
      if(!m.porteroActivo){ toast("No hay portero activo (usa Cambiar)", false); break; }
      addEvent(b.dataset.tipo, m.porteroActivo);
      break;
    }
    case "gkSwitchBtn": openGkSwitch(); break;
    case "setGk": {
      const m = activeMatch();
      m.porteroActivo = id; save(); closeSheet();
      toast("En portería: "+player(id).apodo, false); render();
      break;
    }
    case "rivgoal": addEvent("golRival", null); break;
    case "undo": undoLast(); break;
    case "descanso": {
      const m = activeMatch();
      if(m.periodo===1){ m.periodo=2; m.descansoAt=Date.now(); save();
        toast("2ª parte", false); render(); }
      break;
    }
    case "delEvent": deleteEvent(id); break;
    case "finalizar": {
      const m = activeMatch();
      confirmModal({title:"¿Finalizar el partido?", body:"Podrás volver a editarlo desde el resumen si hace falta.", confirmText:"Finalizar"})
        .then(ok=>{
          if(!ok) return;
          m.finalizado = true; m.finishedAt = Date.now();
          save(); go("export",{id:m.id});
        });
      break;
    }
    /* ---- export ---- */
    case "sharePng": {
      const m = matchById(id);
      const inc = document.getElementById("incPerd") ? document.getElementById("incPerd").checked : true;
      toast("Generando imagen…", false);
      setTimeout(()=> canvasToShare(drawReport(m,{incPerd:inc}),
        `estadisticas_${(m.rival||"partido").replace(/\W+/g,"-")}.png`,
        `${S.team.name} ${score(m).nos}-${score(m).riv} ${m.rival||""}`), 40);
      break;
    }
    case "printPdf": printReportHTML(matchById(id)); break;
    case "csv": csvExport(matchById(id)); break;
    case "reopen": {
      const m = matchById(id);
      if(activeMatch() && activeMatch().id!==id){ alertModal("Hay otro partido en curso", "Finalízalo primero antes de reabrir este."); break; }
      m.finalizado = false; save(); go("match",{tab:"pista"});
      break;
    }
    /* ---- temporada ---- */
    case "seasonPng": {
      toast("Generando imagen…", false);
      setTimeout(()=> canvasToShare(drawSeason(), "temporada_arteixo.png", `${S.team.name} · temporada`), 40);
      break;
    }
    /* ---- plantilla ---- */
    case "editPlayer": V = {name:"playerEdit", id}; renderPlayerEdit(); break;
    case "pickPhoto": photoTarget = id==="__new__" ? null : id;
      if(id==="__new__"){ alertModal("Guarda primero", "Añade la foto después de guardar el jugador."); break; }
      filePick.click(); break;
    case "clearPhoto": { const p=player(id); if(p){p.foto=null; save(); renderPlayerEdit();} break; }
    case "savePlayer": {
      const g = x=>document.getElementById(x).value.trim();
      const nombre=g("e_nombre"), apodo=g("e_apodo")||nombre.split(" ")[0];
      let corto=g("e_corto");
      if(!corto && nombre){ const pp=nombre.split(/\s+/); corto = pp[0][0]+". "+(pp[1]||""); }
      const puesto=document.getElementById("e_puesto").value;
      const cat=document.getElementById("e_cat").value;
      if(!nombre){ alertModal("Falta el nombre", "Pon al menos el nombre del jugador."); break; }
      if(id==="__new__"){
        S.roster.push({id:uid(), nombre, apodo, corto, puesto, cat, foto:null});
      } else {
        const p = player(id);
        Object.assign(p, {nombre, apodo, corto, puesto, cat});
      }
      save(); go("plantilla");
      break;
    }
    case "delPlayer": {
      confirmModal({title:"¿Eliminar de la plantilla?", body:"No afecta a los partidos ya finalizados.", confirmText:"Eliminar", danger:true})
        .then(ok=>{
          if(!ok) return;
          S.roster = S.roster.filter(p=>p.id!==id);
          save(); go("plantilla");
        });
      break;
    }
    /* ---- ajustes ---- */
    case "pickCrest": photoTarget="__crest__"; filePick.click(); break;
    case "clearCrest": S.team.crest=null; preloadCrest(); save(); render(); break;
    case "saveTeam": {
      const v = document.getElementById("a_team").value.trim();
      if(v) S.team.name=v;
      save(); toast("Guardado", false); render(); break;
    }
    case "backup": backup(); break;
    case "restore": jsonPick.click(); break;
    case "resetWeights": S.weights=defaultWeights(); save(); render(); break;
    case "wipe": {
      confirmModal({title:"Borrar todos los datos", body:"Se eliminan la plantilla y TODOS los partidos guardados en este móvil. No se puede deshacer.", confirmText:"Borrar todo", danger:true})
        .then(ok=>{
          if(!ok) return;
          localStorage.removeItem(KEY); S = fresh(); go("home");
        });
      break;
    }
  }
});
function renderPlayerEdit(){ app.innerHTML = viewPlayerEdit(); }

/* ============================================================
   Mantener pulsado un partido para eliminarlo
   ============================================================ */
(function setupLongPress(){
  const DURATION = 550, THRESH = 10;
  let timer=null, startX=0, startY=0, fired=false;
  function clear(){ if(timer){ clearTimeout(timer); timer=null; } }
  document.addEventListener("pointerdown", e=>{
    const row = e.target.closest(".mrow[data-id]");
    if(!row) return;
    fired = false; startX=e.clientX; startY=e.clientY;
    const mid = row.dataset.id;
    timer = setTimeout(()=>{
      fired = true; timer=null; vibrate(25);
      askDeleteMatch(mid);
    }, DURATION);
  });
  document.addEventListener("pointermove", e=>{
    if(!timer) return;
    if(Math.abs(e.clientX-startX)>THRESH || Math.abs(e.clientY-startY)>THRESH) clear();
  });
  document.addEventListener("pointerup", ()=>{
    clear();
    if(fired){
      fired = false;
      document.addEventListener("click", ev=>{ ev.stopImmediatePropagation(); ev.preventDefault(); }, {capture:true, once:true});
    }
  });
  document.addEventListener("pointercancel", clear);
})();

/* season image */
function drawSeason(){
  const {done, rows} = seasonAgg();
  const W = 1000;
  const cv=document.createElement("canvas"); const R=2;
  cv.width=W*R; cv.height=6000*R; const x=cv.getContext("2d"); x.scale(R,R); x.textBaseline="middle";
  const F=(s,w)=>`${w||""} ${s}px -apple-system,Arial,sans-serif`;
  x.fillStyle="#fff"; x.fillRect(0,0,W,6000);
  x.fillStyle="#1b2a6b"; x.fillRect(0,0,W,150); x.fillStyle="#ffd400"; x.fillRect(0,150,W,6);
  x.fillStyle="#fff"; x.font=F(28,"800"); x.fillText(S.team.name.toUpperCase()+" · TEMPORADA", 40, 52);
  let w=0,l=0,d=0,gf=0,gc=0;
  for(const m of done){ const s=score(m); gf+=s.nos;gc+=s.riv; if(s.nos>s.riv)w++;else if(s.nos<s.riv)l++;else d++; }
  x.font=F(16,"600"); x.fillStyle="#cdd3f0";
  x.fillText(`${done.length} partidos · ${w}V ${d}E ${l}D · goles ${gf}-${gc}`, 40, 92);
  let y=190;
  const cols=[
    ["Jugador",240,r=>labelPDF(r.p),"l"],["PJ",50,r=>r.pj],["Goles",70,r=>r.goles],["7m",50,r=>r.g7||""],
    ["%Tiro",70,r=> r.tiros? pct(r.goles,r.tiros)+"%":"—"],["Pérd",60,r=>r.perdidas||""],
    ["Recup",65,r=>r.recup||""],["Bloc",55,r=>r.blocaje||""],["Paradas",80,r=>r.paradas||""],
    ["%Par",70,r=> (r.paradas+r.enc)? pct(r.paradas,r.paradas+r.enc)+"%":"—"],["Valor",70,r=>r.val.toFixed(1)],
  ];
  y = drawTable(x,40,y,W-80,"ACUMULADO POR JUGADOR",cols,rows);
  y+=26; x.fillStyle="#9aa0b4"; x.font=F(12,""); x.fillText(`Generado ${new Date().toLocaleString("es-ES")}`,40,y);
  y+=20;
  const out=document.createElement("canvas");
  out.width=W*R; out.height=Math.ceil(y)*R;
  out.getContext("2d").drawImage(cv,0,0,W*R,out.height,0,0,W*R,out.height);
  return out;
}

/* ---------- migración de partidos antiguos (pista -> titulares) ---------- */
(function migrate(){
  let changed = false;
  for(const m of S.matches){
    if(m.pista && !m.titulares){
      m.titulares = {portero:m.pista.portero||null, campo:(m.pista.campo||[]).slice()};
      m.porteroActivo = m.pista.portero || (m.convocados||[]).find(id=>{const p=player(id);return p&&p.puesto==="portero";}) || null;
      delete m.pista;
      changed = true;
    } else if(!m.titulares){
      m.titulares = {portero:null, campo:[]};
      changed = true;
    }
    if(m.porteroActivo===undefined){
      m.porteroActivo = m.titulares.portero || (m.convocados||[]).find(id=>{const p=player(id);return p&&p.puesto==="portero";}) || null;
      changed = true;
    }
  }
  if(changed) save();
})();

/* ---------- arranque ---------- */
render();
if(activeMatch()) go("match",{tab:"pista"});
